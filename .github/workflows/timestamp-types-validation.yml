# Fork-only diagnostic overlay. Every job checks out the clean three-file supplement.
# The inherited size ratchet remains red; this workflow is excluded from the offered commit.
name: Retained timestamp contract validation
'on':
  push:
    branches:
    - ci/pr800-timestamp-types-20261015
permissions:
  contents: read
concurrency:
  group: pr800-timestamp-types-validation
  cancel-in-progress: true
jobs:
  worker:
    name: mcp worker bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dc442bdbffb098e90fe1f191a776f31476a6e430
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact clean supplement source
      env:
        EXPECTED_PRODUCT_SHA: dc442bdbffb098e90fe1f191a776f31476a6e430
        EXPECTED_PRODUCT_TREE: 86b1ee5811ab7b41f87ae30508e3507eabce9f87
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$EXPECTED_PRODUCT_TREE"

        test "$(git rev-parse HEAD^)" = 01cecdca597ac1066f795e1ba8d8d701b7d492ec

        test -z "$(git status --porcelain)"

        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf ''%s\n'' src/manifest.py
        src/store.py tests/http/test_rooms.py)"

        test "$(git hash-object tests/unit/test_store.py)" = ef1508d4a3f671b7b42b323130340aad0113ff46

        printf ''Product commit: %s\nProduct tree: %s\n'' "$EXPECTED_PRODUCT_SHA"
        "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - name: Build the wrapper wheel the Worker resolves against
      run: uv build --wheel -o mcp/dist --project mcp
    - name: Resolve and bundle the Worker
      working-directory: mcp/worker
      run: "set -o pipefail\nuv run pywrangler deploy --dry-run 2>&1 | tee bundle.log\n\
        if grep -qE '^ERROR|Installation of packages into the Python Worker failed'\
        \ bundle.log; then\n  echo \"::error::pywrangler reported an error while exiting\
        \ 0 \u2014 the bundle is broken.\"\n  exit 1\nfi\ngrep -q 'Total Upload' bundle.log\
        \ || {\n  echo \"::error::pywrangler produced no bundle.\"; exit 1; }\n"
  test:
    name: lint + tests + image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dc442bdbffb098e90fe1f191a776f31476a6e430
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact clean supplement source
      env:
        EXPECTED_PRODUCT_SHA: dc442bdbffb098e90fe1f191a776f31476a6e430
        EXPECTED_PRODUCT_TREE: 86b1ee5811ab7b41f87ae30508e3507eabce9f87
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$EXPECTED_PRODUCT_TREE"

        test "$(git rev-parse HEAD^)" = 01cecdca597ac1066f795e1ba8d8d701b7d492ec

        test -z "$(git status --porcelain)"

        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf ''%s\n'' src/manifest.py
        src/store.py tests/http/test_rooms.py)"

        test "$(git hash-object tests/unit/test_store.py)" = ef1508d4a3f671b7b42b323130340aad0113ff46

        printf ''Product commit: %s\nProduct tree: %s\n'' "$EXPECTED_PRODUCT_SHA"
        "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Lint, types, core size and tests
      run: uv run just check
    - name: Core size report (PR semantics)
      run: uv run sz.py
    - name: Run the example end-to-end
      run: bash examples/beautiful_chat.sh
    - name: Build and verify the MCP wrapper
      run: 'uv build --project mcp --out-dir dist/mcp

        uv run python tests/verify_mcp_dist.py dist/mcp/*.whl dist/mcp/*.tar.gz

        '
    - name: Build image
      run: docker build -f docker/Dockerfile -t technocore-chat:ci .
    - name: Smoke the image
      run: "docker run -d --name technocore-chat-ci -e CHAT_ROOT=/tmp/chat -p 8080:8080\
        \ technocore-chat:ci\nfor _ in $(seq 30); do\n  curl -fsS localhost:8080/healthz\
        \ && break\n  sleep 1\ndone\n# `~` marks a self-asserted nickname: an unsigned\
        \ write can never render as a\n# bare <bot>, so the smoke asserts the unverified\
        \ form the signed lane guarantees.\ncurl -fsS 'localhost:8080/r/ci/say/bot/hello%20ci'\
        \ | grep -q '<~bot> hello ci'\ncurl -fsS localhost:8080/r/ci | grep -q 'hello\
        \ ci'\n# The metadata documents are built at import from pyproject.toml and\
        \ store's\n# constants, so they are also the check that the image copied both\
        \ \u2014 a manifest\n# that 500s is a delisting from every registry that revalidates.\n\
        curl -fsS localhost:8080/openapi.json | grep -q '\"openapi\"'\ncurl -fsS localhost:8080/.well-known/agent.json\
        \ | grep -q '\"content_is_untrusted\"'\ndocker rm -f technocore-chat-ci\n"
  contract:
    name: openapi contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dc442bdbffb098e90fe1f191a776f31476a6e430
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact clean supplement source
      env:
        EXPECTED_PRODUCT_SHA: dc442bdbffb098e90fe1f191a776f31476a6e430
        EXPECTED_PRODUCT_TREE: 86b1ee5811ab7b41f87ae30508e3507eabce9f87
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$EXPECTED_PRODUCT_TREE"

        test "$(git rev-parse HEAD^)" = 01cecdca597ac1066f795e1ba8d8d701b7d492ec

        test -z "$(git status --porcelain)"

        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf ''%s\n'' src/manifest.py
        src/store.py tests/http/test_rooms.py)"

        test "$(git hash-object tests/unit/test_store.py)" = ef1508d4a3f671b7b42b323130340aad0113ff46

        printf ''Product commit: %s\nProduct tree: %s\n'' "$EXPECTED_PRODUCT_SHA"
        "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Start the service
      run: "CHAT_ROOT=\"$(mktemp -d)\" \\\nCHAT_MAX_WAIT=1 \\\nCHAT_RATE_READ=1000000\
        \ CHAT_RATE_WRITE=1000000 CHAT_RATE_ROOMS_PER_DAY=1000000 \\\n  uv run uvicorn\
        \ --app-dir src app:app --port 8099 --log-level warning &\nfor _ in $(seq\
        \ 30); do\n  curl -fsS localhost:8099/healthz && break\n  sleep 1\ndone\n"
    - name: Check the running service against its own /openapi.json
      run: "uv run schemathesis run http://localhost:8099/openapi.json \\\n  --url\
        \ http://localhost:8099 \\\n  --checks not_a_server_error,status_code_conformance,content_type_conformance,response_headers_conformance,response_schema_conformance,unsupported_method,allow_header_conformance\
        \ \\\n  --phases examples,coverage,fuzzing \\\n  --max-examples 25 \\\n  --generation-deterministic\
        \ \\\n  --max-response-time 10 \\\n  --warnings missing_deserializer,unused_openapi_auth,unsupported_regex,method_not_allowed,constants_extraction,unmatched_filter\
        \ \\\n  --no-color\n"
  browser:
    name: humans page in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dc442bdbffb098e90fe1f191a776f31476a6e430
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact clean supplement source
      env:
        EXPECTED_PRODUCT_SHA: dc442bdbffb098e90fe1f191a776f31476a6e430
        EXPECTED_PRODUCT_TREE: 86b1ee5811ab7b41f87ae30508e3507eabce9f87
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$EXPECTED_PRODUCT_TREE"

        test "$(git rev-parse HEAD^)" = 01cecdca597ac1066f795e1ba8d8d701b7d492ec

        test -z "$(git status --porcelain)"

        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf ''%s\n'' src/manifest.py
        src/store.py tests/http/test_rooms.py)"

        test "$(git hash-object tests/unit/test_store.py)" = ef1508d4a3f671b7b42b323130340aad0113ff46

        printf ''Product commit: %s\nProduct tree: %s\n'' "$EXPECTED_PRODUCT_SHA"
        "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Node and Playwright
      working-directory: tests
      run: 'node --version

        # `npm ci` and not `npm install`: the lockfile is the pin, exactly as uv.lock
        is.

        npm ci

        # Chromium only. --with-deps installs the shared libraries the runner image
        does

        # not carry; without it the browser launches and immediately dies on a missing
        .so.

        npx playwright install --with-deps chromium

        '
    - name: Start the service
      run: "CHAT_ROOT=\"$(mktemp -d)\" \\\n  uv run uvicorn --app-dir src app:app\
        \ --port 8099 --log-level warning &\nfor _ in $(seq 30); do\n  curl -fsS localhost:8099/healthz\
        \ && break\n  sleep 1\ndone\n"
    - name: Drive /humans in Chromium
      run: node tests/humans_ui_probe.mjs 8099
  ratchet:
    name: Inherited core size ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: dc442bdbffb098e90fe1f191a776f31476a6e430
        persist-credentials: false
        fetch-depth: 2
    - name: Verify exact clean supplement source
      env:
        EXPECTED_PRODUCT_SHA: dc442bdbffb098e90fe1f191a776f31476a6e430
        EXPECTED_PRODUCT_TREE: 86b1ee5811ab7b41f87ae30508e3507eabce9f87
      run: 'set -euo pipefail

        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"

        test "$(git rev-parse ''HEAD^{tree}'')" = "$EXPECTED_PRODUCT_TREE"

        test "$(git rev-parse HEAD^)" = 01cecdca597ac1066f795e1ba8d8d701b7d492ec

        test -z "$(git status --porcelain)"

        test "$(git diff --name-only HEAD^ HEAD)" = "$(printf ''%s\n'' src/manifest.py
        src/store.py tests/http/test_rooms.py)"

        test "$(git hash-object tests/unit/test_store.py)" = ef1508d4a3f671b7b42b323130340aad0113ff46

        printf ''Product commit: %s\nProduct tree: %s\n'' "$EXPECTED_PRODUCT_SHA"
        "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

        '
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Verify unchanged size baseline
      run: git diff --exit-code HEAD^ HEAD -- sz-baseline.json
    - name: Report inherited ratchet failure as failure
      run: uv run sz.py --check
    if: github.repository == 'almondous/technocore-chat'
