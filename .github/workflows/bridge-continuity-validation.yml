# Validation-only overlay for the approved two-file #545 bridge supplement.
# Publish only on the separate fork CI branch; never add this to the product PR.
# Every job tests the exact product commit/tree, not the overlay commit.
name: Bridge continuity validation
on:
  push:
    branches: [ci/bridge-continuity-20261009]
permissions:
  contents: read
concurrency:
  group: bridge-continuity-validation
  cancel-in-progress: true
jobs:
  # Separate job, not a step in `test`: this one downloads a Pyodide toolchain and an npm
  # wrangler, which has nothing to do with the service and would push a 10-minute budget.
  # It exists because the deploy path had three independent breakages that every other gate
  # in this file was blind to — the bundle would not resolve, the Worker would not start,
  # and it served one request per isolate — and none of them is visible from Python tests.
  worker:
    name: "mcp worker bundles"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          persist-credentials: false
      - name: Verify immutable bridge-continuity product revision
        env:
          EXPECTED_PRODUCT_SHA: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          EXPECTED_PRODUCT_TREE: 3b03097962de53d2c8949fdbe5cd5dfd258c6909
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf 'Product commit: %s\nProduct tree: %s\n' \
            "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # pywrangler installs prebuilt wheels only, so the wrapper has to be a wheel before
      # the Worker can bundle it. This is the step a human forgets; here it cannot be.
      - name: Build the wrapper wheel the Worker resolves against
        # `-o` is relative to the working directory, not to `--project`, so the wheel has
        # to be aimed at mcp/dist — that is where the Worker's `find-links = ["../dist"]`
        # looks, and a repo-root `dist/` leaves it resolving against an absent directory.
        run: uv build --wheel -o mcp/dist --project mcp

      # `--dry-run` resolves against the Pyodide index and bundles without deploying, which
      # is where all three breakages showed up. It needs no Cloudflare credentials.
      #
      # The `grep -q ERROR` is not belt-and-braces: pywrangler exits 0 when the Pyodide
      # install fails, so the exit code alone reports a broken bundle as a pass. Fail on
      # the log instead, and print it either way.
      - name: Resolve and bundle the Worker
        working-directory: mcp/worker
        run: |
          set -o pipefail
          uv run pywrangler deploy --dry-run 2>&1 | tee bundle.log
          if grep -qE '^ERROR|Installation of packages into the Python Worker failed' bundle.log; then
            echo "::error::pywrangler reported an error while exiting 0 — the bundle is broken."
            exit 1
          fi
          grep -q 'Total Upload' bundle.log || {
            echo "::error::pywrangler produced no bundle."; exit 1; }

  test:
    name: "lint + tests + image"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
      # Full commit pins are the only immutable form for third-party actions. Dependabot
      # updates these SHAs and the release comments together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Runs PR-controlled code (the service and its tests), so no checkout
          # credentials are persisted where that code could read them.
          ref: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          persist-credentials: false
      - name: Verify immutable bridge-continuity product revision
        env:
          EXPECTED_PRODUCT_SHA: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          EXPECTED_PRODUCT_TREE: 3b03097962de53d2c8949fdbe5cd5dfd258c6909
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf 'Product commit: %s\nProduct tree: %s\n' \
            "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

      # Installs the interpreter named in .python-version, so CI, local dev and the
      # image all run the same 3.12.
      # Resolved from the full release version to an immutable commit: setup-uv stopped
      # publishing floating major tags after v7, and Dependabot bumps this SHA.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen

      # One command, defined once, in the repo-root justfile: ruff, the formatter in
      # --check mode, ty, `sz.py --caps` and the coverage run. Spelling the list out here
      # as well would give a contributor a second copy to fall behind — CONTRIBUTING names
      # the recipe, and this step is the same recipe, so "run what CI runs" is literal.
      # Why each command is in that list is commented beside it in the justfile.
      - name: Lint, types, core size and tests
        run: uv run just check

      # Measurement with a floor, not a cap on thinking: comments are reported raw (they
      # are protocol rationale) and only core code-lines are enforced, against the
      # committed sz-baseline.json. Shrink the core and commit the new floor with
      # `uv run sz.py --update-baseline`; growing it needs the same, deliberately.
      #
      # Outside `just check` because it is the half a contributor cannot run to a verdict:
      # fork PRs cannot update sz-baseline.json (queue-guard protects that
      # maintainer-generated file), so the recipe carries the immutable policy caps and the
      # ratchet against the committed baseline stays on pushes to main, where maintainers
      # can regenerate it after reviewing the merged change.
      # This is a fork push that reproduces PR gates, not a push to product main.
      # `just check` enforces policy caps; the maintainer-owned ratchet is main-only.
      - name: Core size report (PR semantics)
        run: uv run sz.py

      # The example is the repo's one-command promise made executable: self-booting on
      # a free port, self-cleaning, deterministic. All four PR-#54 review findings lived
      # in code no gate ever ran; this — plus tests/http/test_signer.py — is that gate.
      - name: Run the example end-to-end
        run: bash examples/beautiful_chat.sh

      # The MCP wrapper is a separate distribution with its own dependency line, so nothing
      # else would notice a broken pyproject until someone ran `uv publish`. Its tests are
      # in the suite above; this is the packaging half.
      - name: Build and verify the MCP wrapper
        run: |
          uv build --project mcp --out-dir dist/mcp
          uv run python tests/verify_mcp_dist.py dist/mcp/*.whl dist/mcp/*.tar.gz

      - name: Build image
        run: docker build -f docker/Dockerfile -t technocore-chat:ci .

      - name: Smoke the image
        run: |
          docker run -d --name technocore-chat-ci -e CHAT_ROOT=/tmp/chat -p 8080:8080 technocore-chat:ci
          for _ in $(seq 30); do
            curl -fsS localhost:8080/healthz && break
            sleep 1
          done
          # `~` marks a self-asserted nickname: an unsigned write can never render as a
          # bare <bot>, so the smoke asserts the unverified form the signed lane guarantees.
          curl -fsS 'localhost:8080/r/ci/say/bot/hello%20ci' | grep -q '<~bot> hello ci'
          curl -fsS localhost:8080/r/ci | grep -q 'hello ci'
          # The metadata documents are built at import from pyproject.toml and store's
          # constants, so they are also the check that the image copied both — a manifest
          # that 500s is a delisting from every registry that revalidates.
          curl -fsS localhost:8080/openapi.json | grep -q '"openapi"'
          curl -fsS localhost:8080/.well-known/agent.json | grep -q '"content_is_untrusted"'
          docker rm -f technocore-chat-ci

  # Separate because it needs the service running, and because a red contract check should
  # point at the contract rather than at "the tests". It fetches the instance's own
  # /openapi.json, so there is no committed copy to drift.
  contract:
    name: "openapi contract"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          persist-credentials: false
      - name: Verify immutable bridge-continuity product revision
        env:
          EXPECTED_PRODUCT_SHA: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          EXPECTED_PRODUCT_TREE: 3b03097962de53d2c8949fdbe5cd5dfd258c6909
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf 'Product commit: %s\nProduct tree: %s\n' \
            "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen

      # Tuned so the fuzzer spends its budget on handlers rather than on the parts that
      # exist to stop it. CHAT_MAX_WAIT is the ceiling `wait` clamps to, and at the
      # default 10 a few generated long polls cost more than the whole run; without the
      # rate bumps the limiter answers most of it with a 429 that conforms and checks
      # nothing. Everything else is the shipped configuration.
      - name: Start the service
        run: |
          CHAT_ROOT="$(mktemp -d)" \
          CHAT_MAX_WAIT=1 \
          CHAT_RATE_READ=1000000 CHAT_RATE_WRITE=1000000 CHAT_RATE_ROOMS_PER_DAY=1000000 \
            uv run uvicorn --app-dir src app:app --port 8099 --log-level warning &
          for _ in $(seq 30); do
            curl -fsS localhost:8099/healthz && break
            sleep 1
          done

      # Deterministic: --generation-deterministic fixes the generation (superseding
      # --seed, which the CLI then ignores) and the pinned schemathesis fixes the generator,
      # so a failure is a change in this service. ~800 requests in under ten seconds.
      #
      # Checks are named rather than `all`, because two of the rest assume things this
      # service breaks on purpose: positive_data_acceptance expects valid input to succeed,
      # but a valid write to a mailbox or a reserved namespace is refused; and
      # negative_data_rejection's generator also invents a query parameter the document
      # does not list and expects a refusal, which this service will never give — ignoring
      # unknown query parameters is what makes the documented `?n=` cache-buster work at
      # all. Turning that one mutation off is a config-file setting the CLI has no flag
      # for, so the negative half of the contract is enforced by tests/test_contract.py
      # (in-process, on every `pytest`, with `allow-extra-parameters` off and the input
      # doctrine of docs/design.md §3.5 behind it) rather than here. What this job asserts
      # is the over-the-wire half: no 500s, every response matching the status, content
      # type, headers and schema promised, and the two 405 checks, since Allow is the
      # machine-readable half of a refused method.
      #
      # --warnings lists what to *enable*. Three are left out because they can never clear:
      # missing_auth (POST /r/events only ever 403s, and there are no credentials to
      # suggest), validation_mismatch (a generated 86-character string is never a valid
      # Ed25519 signature), missing_test_data (a generated note name has never been
      # written, and 404 is the right answer). A warning that is always there is one
      # nobody reads.
      - name: Check the running service against its own /openapi.json
        run: |
          uv run schemathesis run http://localhost:8099/openapi.json \
            --url http://localhost:8099 \
            --checks not_a_server_error,status_code_conformance,content_type_conformance,response_headers_conformance,response_schema_conformance,unsupported_method,allow_header_conformance \
            --phases examples,coverage,fuzzing \
            --max-examples 25 \
            --generation-deterministic \
            --max-response-time 10 \
            --warnings missing_deserializer,unused_openapi_auth,unsupported_regex,method_not_allowed,constants_extraction,unmatched_filter \
            --no-color

  regression:
    name: "bridge baseline and fixed proof"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          persist-credentials: false
          # The baseline is an ancestor of the immutable product commit.
          fetch-depth: 0
      - name: Verify immutable bridge-continuity product revision
        env:
          EXPECTED_PRODUCT_SHA: 0b63f7e3f9625afb89f754aa0945e395cde2202a
          EXPECTED_PRODUCT_TREE: 3b03097962de53d2c8949fdbe5cd5dfd258c6909
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          printf 'Product commit: %s\nProduct tree: %s\n' \
            "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Verify supplement scope and unchanged contributor provenance
        env:
          BASELINE_SHA: b91dff5a8f953f7ee8e51be4cc850ef8178304f9
          BASELINE_TREE: 89c0d74d5dd0314f02ba6b0257ef3fc80b763f75
        run: |
          set -euo pipefail
          test "$(git rev-parse "$BASELINE_SHA^{tree}")" = "$BASELINE_TREE"
          git merge-base --is-ancestor "$BASELINE_SHA" HEAD
          test "$(git diff --name-only "$BASELINE_SHA" HEAD)" = \
            "$(printf '%s\n' src/interop.md tests/unit/test_interop_continuity.py)"
          git diff --exit-code "$BASELINE_SHA" HEAD -- \
            tests/unit/test_interop_bridge.py docs/review/pr545-checkpoint-tests/
          sha256sum -c docs/review/pr545-checkpoint-tests/SHA256SUMS
          sha256sum -c <<'HASHES'
          6d4602481ad8cbc73da6f6c476893211eac70ed4fbf4189a84268ffcc2618f93  tests/unit/test_interop_bridge.py
          0ee6326bba1390270bb6b86b2b77eeea7f312c3b2415b14d3f58675964ff7469  docs/review/pr545-checkpoint-tests/README.md
          767469c822b16bd534085ae096ef396e576583ea5b13c5d83c85d91533f3f1ff  docs/review/pr545-checkpoint-tests/SHA256SUMS
          bc56fa48cbdec036d9ae7d1c7ffc8d4fdafe0e977eb51dbf99b241499f365f9a  docs/review/pr545-checkpoint-tests/pr545-checkpoint-tests.patch
          381f2326cad3e48cdc78b71e2e5acd4a7df0d4827ebc7adc5d802d1e8841d8dc  docs/review/pr545-checkpoint-tests/reproduce-internal-gap.py
          512095d12cb6adecc7f995abea4ec16476276ab97b361160407e4649b2e74fb8  src/interop.md
          7de408a5d2e79a2e4f16f3bb6db1adbd4f4c78c33a453d2265ea5c7dcdbad842  tests/unit/test_interop_continuity.py
          HASHES

      - name: Prove the unchanged baseline fails the original 11 new cases
        run: |
          set -euo pipefail
          baseline="$(mktemp -d "$RUNNER_TEMP/bridge-baseline.XXXXXX")"
          git worktree add --detach "$baseline" b91dff5a8f953f7ee8e51be4cc850ef8178304f9
          trap 'git worktree remove --force "$baseline"' EXIT
          test "$(git -C "$baseline" rev-parse HEAD)" = b91dff5a8f953f7ee8e51be4cc850ef8178304f9
          test "$(git -C "$baseline" rev-parse 'HEAD^{tree}')" = 89c0d74d5dd0314f02ba6b0257ef3fc80b763f75
          test -z "$(git -C "$baseline" status --porcelain)"
          # Copy only the reviewed new tests. The original document and harness stay
          # at b91dff5, in a separate checkout; the fixed product is never reverted.
          cp tests/unit/test_interop_continuity.py "$baseline/tests/unit/"
          (cd "$baseline" && uv sync --frozen)
          set +e
          (cd "$baseline" && uv run pytest tests/unit/test_interop_continuity.py -q \
            --junitxml="$RUNNER_TEMP/bridge-baseline.xml") 2>&1 | tee "$RUNNER_TEMP/bridge-baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" = 1
          python - <<'PYTEST'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          cases = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "bridge-baseline.xml").findall(".//testcase")
          refused = {
              f"test_resumed_batch_refuses_discontinuity_before_delivery[{case}-{source}]"
              for case in ("internal-hole", "saved-zero", "duplicate", "out-of-order")
              for source in ("read", "export")
          } | {
              "test_continuity_is_required_after_cold_start_saves_its_first_batch",
              "test_discontinuity_is_refused_before_filtering_bridge_echoes",
          }
          control = "test_contiguous_bridge_echo_counts_toward_the_checkpoint"
          assert len(cases) == 11, len(cases)
          assert {case.attrib["name"] for case in cases} == refused | {control}
          assert not any(case.find("error") is not None or case.find("skipped") is not None for case in cases)
          failures = {case.attrib["name"]: case.find("failure") for case in cases if case.find("failure") is not None}
          assert set(failures) == refused, failures
          assert all("EndOfPollsError" in (failure.attrib.get("message", "") + (failure.text or "")) for failure in failures.values())
          print("Verified unchanged b91dff5 baseline: 10 expected failures, 1 positive-control pass.")
          PYTEST
          git -C "$baseline" diff --exit-code
          printf '%s\n' 'Baseline b91dff5: 10 expected failures, 1 positive-control pass.' >> "$GITHUB_STEP_SUMMARY"

      - name: Prove the exact fixed product passes all 24 original and new cases
        run: |
          set -euo pipefail
          uv run pytest tests/unit/test_interop_bridge.py tests/unit/test_interop_continuity.py -q \
            --junitxml="$RUNNER_TEMP/bridge-fixed.xml"
          python - <<'PYTEST'
          import os
          from pathlib import Path
          from xml.etree import ElementTree as ET

          cases = ET.parse(Path(os.environ["RUNNER_TEMP"]) / "bridge-fixed.xml").findall(".//testcase")
          assert len(cases) == 24, len(cases)
          assert not any(list(case) for case in cases), "Fixed product has a failure, error, skip or other unexpected result"
          print("Verified exact fixed product: all 24 original and new cases passed.")
          PYTEST
          git diff --exit-code
          printf '%s\n' 'Fixed product: all 24 original and new cases passed.' >> "$GITHUB_STEP_SUMMARY"
