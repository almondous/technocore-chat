# Fork-only diagnostic overlay. All jobs validate the clean two-file product SHA.
# Existing static and ratchet failures remain red; this workflow is not a product patch.
name: Matrix create reconciliation validation
'on':
  push:
    branches:
    - ci/pr973-create-room-20261012
permissions:
  contents: read
concurrency:
  group: pr973-create-reconciliation-validation
  cancel-in-progress: true
jobs:
  test:
    name: bridge + core tests + packaging + image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        persist-credentials: false
        fetch-depth: 2
    - name: Verify immutable Matrix supplement product revision
      env:
        EXPECTED_PRODUCT_SHA: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        EXPECTED_PRODUCT_TREE: de8c7313674da6401802df9a02dddffb4720770d
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
        test -z "$(git status --porcelain)"
        printf 'Product commit: %s\nProduct tree: %s\n' \
          "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Verify exact two-file supplement and preserved author tests
      run: |
        set -euo pipefail
        parent=5d5c7fcbdb350ede03b8a62ed54362c38d666049
        test "$(git rev-parse HEAD^)" = "$parent"
        test "$(git diff --name-only "$parent" HEAD)" = "$(printf '%s\n' contrib/technocore-matrix/bridge.py contrib/technocore-matrix/tests/test_create_reconciliation.py)"
        git diff --exit-code "$parent" HEAD -- contrib/technocore-matrix/tests/test_bridge.py
        test "$(git hash-object contrib/technocore-matrix/tests/test_bridge.py)" = 26d10646a4ff3769f9bdbed76b5bc19a63f93de1
    - name: Native bridge tests (35 original + 9 added)
      run: uv run python -m unittest discover -s contrib/technocore-matrix/tests -p 'test*.py'
    - name: Added tests lint and formatting
      run: |-
        uv run ruff check contrib/technocore-matrix/tests/test_create_reconciliation.py
        uv run ruff format --check contrib/technocore-matrix/tests/test_create_reconciliation.py
    - name: Core policy caps
      run: uv run sz.py --caps
    - name: Core coverage suite
      run: |-
        uv run coverage run -m pytest tests -q
        uv run coverage report
    - name: Core size report (PR semantics)
      run: uv run sz.py
    - name: Run the example end-to-end
      run: bash examples/beautiful_chat.sh
    - name: Build and verify the MCP wrapper
      run: |
        uv build --project mcp --out-dir dist/mcp
        uv run python tests/verify_mcp_dist.py dist/mcp/*.whl dist/mcp/*.tar.gz
    - name: Build image
      run: docker build -f docker/Dockerfile -t technocore-chat:ci .
    - name: Smoke the image
      run: "docker run -d --name technocore-chat-ci -e CHAT_ROOT=/tmp/chat -p 8080:8080 technocore-chat:ci\nfor _ in $(seq 30); do\n  curl -fsS localhost:8080/healthz && break\n  sleep 1\ndone\n# `~` marks a self-asserted nickname: an unsigned write can never render as a\n# bare <bot>, so the smoke asserts the unverified form the signed lane guarantees.\ncurl -fsS 'localhost:8080/r/ci/say/bot/hello%20ci' | grep -q '<~bot> hello ci'\ncurl -fsS localhost:8080/r/ci | grep -q 'hello ci'\n# The metadata documents are built at import from pyproject.toml and store's\n# constants, so they are also the check that the image copied both \u2014 a manifest\n# that 500s is a delisting from every registry that revalidates.\ncurl -fsS localhost:8080/openapi.json | grep -q '\"openapi\"'\ncurl -fsS localhost:8080/.well-known/agent.json | grep -q '\"content_is_untrusted\"'\ndocker rm -f technocore-chat-ci\n"
  static:
    name: 'Inherited gate: ${{ matrix.name }}'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'almondous/technocore-chat'
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: ruff
          command: uv run ruff check .
        - name: format
          command: uv run ruff format --check .
        - name: types
          command: uv run ty check
        - name: size ratchet
          command: uv run sz.py --check
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        persist-credentials: false
        fetch-depth: 2
    - name: Verify immutable Matrix supplement product revision
      env:
        EXPECTED_PRODUCT_SHA: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        EXPECTED_PRODUCT_TREE: de8c7313674da6401802df9a02dddffb4720770d
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
        test -z "$(git status --porcelain)"
        printf 'Product commit: %s\nProduct tree: %s\n' \
          "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Run unchanged repository gate (failures remain failures)
      run: ${{ matrix.command }}
  contract:
    name: openapi contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        persist-credentials: false
    - name: Verify immutable Matrix supplement product revision
      env:
        EXPECTED_PRODUCT_SHA: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        EXPECTED_PRODUCT_TREE: de8c7313674da6401802df9a02dddffb4720770d
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
        test -z "$(git status --porcelain)"
        printf 'Product commit: %s\nProduct tree: %s\n' \
          "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - run: uv sync --frozen
    - name: Start the service
      run: |
        CHAT_ROOT="$(mktemp -d)" \
        CHAT_MAX_WAIT=1 \
        CHAT_RATE_READ=1000000 CHAT_RATE_WRITE=1000000 CHAT_RATE_ROOMS_PER_DAY=1000000 \
          uv run uvicorn --app-dir src app:app --port 8099 --log-level warning &
        for _ in $(seq 30); do
          curl -fsS localhost:8099/healthz && break
          sleep 1
        done
    - name: Check the running service against its own /openapi.json
      run: |
        uv run schemathesis run http://localhost:8099/openapi.json \
          --url http://localhost:8099 \
          --checks not_a_server_error,status_code_conformance,content_type_conformance,response_headers_conformance,response_schema_conformance,unsupported_method,allow_header_conformance \
          --phases examples,coverage,fuzzing \
          --max-examples 25 \
          --generation-deterministic \
          --max-response-time 10 \
          --warnings missing_deserializer,unused_openapi_auth,unsupported_regex,method_not_allowed,constants_extraction,unmatched_filter \
          --no-color
  worker:
    name: mcp worker bundles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'almondous/technocore-chat'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        persist-credentials: false
    - name: Verify immutable Matrix supplement product revision
      env:
        EXPECTED_PRODUCT_SHA: 240d8b70e0d8a0f57190c93d96356d62dfe42856
        EXPECTED_PRODUCT_TREE: de8c7313674da6401802df9a02dddffb4720770d
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$EXPECTED_PRODUCT_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_PRODUCT_TREE"
        test -z "$(git status --porcelain)"
        printf 'Product commit: %s\nProduct tree: %s\n' \
          "$EXPECTED_PRODUCT_SHA" "$EXPECTED_PRODUCT_TREE" >> "$GITHUB_STEP_SUMMARY"
    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      with:
        enable-cache: true
    - name: Build the wrapper wheel the Worker resolves against
      run: uv build --wheel -o mcp/dist --project mcp
    - name: Resolve and bundle the Worker
      working-directory: mcp/worker
      run: "set -o pipefail\nuv run pywrangler deploy --dry-run 2>&1 | tee bundle.log\nif grep -qE '^ERROR|Installation of packages into the Python Worker failed' bundle.log; then\n  echo \"::error::pywrangler reported an error while exiting 0 \u2014 the bundle is broken.\"\n  exit 1\nfi\ngrep -q 'Total Upload' bundle.log || {\n  echo \"::error::pywrangler produced no bundle.\"; exit 1; }\n"
